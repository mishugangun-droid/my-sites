<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIGHT VISUAL - Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:\'Inter\',sans-serif}
body{background:#070A13;color:#fff;padding:20px}
.container{max-width:1100px;margin:0 auto}
h1{font-size:28px;margin-bottom:5px} h1 span{color:#8A5CFF}
.card{background:#111528;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:24px;margin-top:20px}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.controls div{display:flex;flex-direction:column;gap:6px}
label{font-size:12px;opacity:0.6}
select,input{background:#070A13;border:1px solid rgba(255,255,255,0.1);color:#fff;padding:12px;border-radius:10px;outline:none}
.btn{padding:12px 20px;border-radius:10px;font-weight:700;cursor:pointer;border:none}
.btn-primary{background:#8A5CFF;color:#fff}
.btn-funpay{background:#ffde00;color:#000}
.btn-ghost{background:rgba(255,255,255,0.07);color:#fff;border:1px solid rgba(255,255,255,0.1)}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px}
th{opacity:0.5;text-align:left;padding:10px;border-bottom:1px solid rgba(255,255,255,0.08)}
td{padding:10px;border-bottom:1px solid rgba(255,255,255,0.05)}
.key{font-family:monospace;letter-spacing:1px;color:#4FC3FF}
.badge{padding:3px 8px;border-radius:100px;font-size:11px;background:rgba(138,92,255,0.2);border:1px solid rgba(138,92,255,0.3)}
.expired{color:#ff5a5a} .active{color:#4ade80}
</style>
<script>
// ЗАЩИТА АДМИНКИ - ПОМЕНЯЙ ПАРОЛЬ ТУТ
const ADMIN_PASS = "NightVisualSDSERwg";
if(!sessionStorage.getItem(\'night_auth\')){
  let p = prompt("Пароль от админки NIGHT VISUAL:");
  if(p !== ADMIN_PASS){ document.documentElement.innerHTML="<h1 style=\'text-align:center;margin-top:100px\'>Доступ запрещен</h1>"; throw new Error("wrong pass"); }
  sessionStorage.setItem(\'night_auth\',\'1\');
}
</script>
</head>
<body>
<div class="container">
  <h1>NIGHT <span>VISUAL</span> ADMIN</h1>
  <p style="opacity:0.5">Генератор ключей для FunPay • Авто-выдача</p>

  <div class="card">
    <div class="controls">
      <div><label>Тариф</label><select id="tariff">
        <option value="2">2 дня - TRIAL</option>
        <option value="30">30 дней - 299₽</option>
        <option value="60" selected>60 дней - 499₽</option>
        <option value="120">120 дней - 849₽</option>
        <option value="9999">НАВСЕГДА - 1499₽</option>
      </select></div>
      <div><label>Количество</label><input id="count" type="number" value="10" min="1" max="100" style="width:100px"></div>
      <button class="btn btn-primary" onclick="generateBulk()">Сгенерировать</button>
      <button class="btn btn-funpay" onclick="exportTxt()">Скачать .txt для FunPay</button>
      <button class="btn btn-ghost" onclick="clearAll()" style="margin-left:auto;color:#ff5a5a">Очистить всё</button>
    </div>
    <div style="margin-top:12px;font-size:12px;opacity:0.4">Сгенерированные ключи сохраняются в браузере. Скачай .txt и загрузи его в FunPay в раздел "Авто-выдача".</div>
    <table>
      <thead><tr><th>#</th><th>Ключ</th><th>Тариф</th><th>Истекает</th><th>Статус</th><th></th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
const DB_KEY = "NIGHT_KEYS_DB";
function getDB(){ return JSON.parse(localStorage.getItem(DB_KEY) || "[]"); }
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); // для совместимости со старой системой
  db.forEach(k=> localStorage.setItem(k.key, k.expires));
}
function genKey(){
  return \'NIGHT-\' + Math.random().toString(36).substring(2,6).toUpperCase() + \'-\' + Math.random().toString(36).substring(2,6).toUpperCase();
}
function generateBulk(){
  let days = parseInt(document.getElementById(\'tariff\').value);
  let count = parseInt(document.getElementById(\'count\').value);
  let db = getDB();
  for(let i=0;i<count;i++){
    let key = genKey();
    let expires = days===9999 ? Date.now()+100*365*24*60*60*1000 : Date.now()+days*24*60*60*1000;
    db.unshift({key, days, expires, created: Date.now()});
  }
  saveDB(db); render();
}
function render(){
  let db = getDB();
  let tbody = document.getElementById(\'tableBody\');
  tbody.innerHTML = "";
  db.forEach((k,i)=>{
    let isForever = k.days===9999;
    let date = isForever ? "НАВСЕГДА" : new Date(k.expires).toLocaleDateString();
    let isExpired = k.expires < Date.now();
    tbody.innerHTML += `<tr>
      <td>${i+1}</td>
      <td class="key">${k.key}</td>
      <td><span class="badge">${isForever?\'FOREVER\':k.days+\' ДН\'}</span></td>
      <td>${date}</td>
      <td class="${isExpired?\'expired\':\'active\'}">${isExpired?\'Истёк\':\'Активен\'}</td>
      <td><button class="btn btn-ghost" style="padding:4px 8px;font-size:12px" onclick="copyKey(\'${k.key}\')">Копировать</button></td>
    </tr>`;
  });
}
function copyKey(k){ navigator.clipboard.writeText(k); alert("Скопировано: "+k); }
function exportTxt(){
  let db = getDB();
  if(!db.length) return alert("Сначала сгенерируй ключи");
  let text = db.map(k=>k.key).join("\n");
  let blob = new Blob([text], {type:"text/plain"});
  let a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "night_visual_keys_"+new Date().toISOString().slice(0,10)+".txt"; a.click();
}
function clearAll(){ if(confirm("Удалить все ключи?")){ localStorage.removeItem(DB_KEY); render(); } }
render();

// Обновляем checker на главном сайте чтобы он читал из этой базы
</script>
</body>
</html>
